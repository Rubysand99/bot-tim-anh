name: CI

# Kiểm tra nhanh mỗi lần push nhánh / mở PR: biên dịch + unit test + lint cơ bản.
# KHÔNG đụng tới Pinterest hay MongoDB thật (test dùng module giả) nên an toàn
# để chạy thường xuyên. Workflow crawl thật nằm ở main.yml (chỉ cron + thủ công).
on:
  push:
    branches-ignore: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: python -m compileall -q .
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python -m unittest discover -s tests -v
