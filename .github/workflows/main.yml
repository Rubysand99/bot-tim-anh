name: Run Python Script

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # cho phép chạy thủ công từ tab Actions
  schedule:
    - cron: "0 */2 * * *"  # chạy tự động mỗi 2 tiếng (giờ UTC)

concurrency:
  group: crawl-job
  cancel-in-progress: false  # để job đang chạy chạy xong, không huỷ giữa chừng

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python crawl_job.py
